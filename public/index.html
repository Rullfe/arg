<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            user-select: none;
            box-sizing: border-box;
        }
        body {
            background: #000;
            color: #ff2222;
            font-family: serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }
        .noise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .ghost-text {
            font-size: clamp(36px, 10vw, 64px);
            animation: flicker 0.12s infinite;
            text-align: center;
            line-height: 2.4;
            color: #ff2626;
            text-shadow: 0 0 12px #ff0000;
        }
        @keyframes flicker {
            0% { opacity: 1; }
            30% { opacity: 0.1; }
            60% { opacity: 0.7; }
            100% { opacity: 1; }
        }
        .float {
            position: absolute;
            color: #ff4444;
            font-size: clamp(18px, 4vw, 26px);
            z-index: 2;
            animation: floatMove linear forwards;
            text-shadow: 0 0 6px #ff0000;
            top: 100%;
        }
        @keyframes floatMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(calc(-100vh - 120px)); }
        }
        .shadow-cursor {
            position: fixed;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(40,0,0,0.85) 0%, transparent 70%);
            pointer-events: none;
            z-index: 3;
            transform: translate(-50%, -50%);
            left: -999px;
            top: -999px;
        }
        .pop {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #000;
            border: 3px solid #ff2222;
            padding: 40px 30px;
            font-size: clamp(28px, 7vw, 48px);
            color: #ff2222;
            text-shadow: 0 0 10px red;
            z-index: 10;
            display: none;
            animation: popFlicker 0.08s infinite;
        }
        @keyframes popFlicker {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
        }
    </style>
</head>
<body>
<audio id="bgMusic" loop preload="auto">
    <source src="horror.mp3" type="audio/mpeg">
</audio>

<div class="noise"></div>
<div class="shadow-cursor"></div>
<div class="pop" id="popBox">你看到我了...</div>

<div class="container">
    <div class="ghost-text">
        你很聪明<br>
        但这只是刚刚开始...
    </div>
</div>

<script>
const audio = document.getElementById('bgMusic');
document.body.addEventListener('click', () => {
    audio.volume = 0.35;
    audio.play().catch(() => {});
}, { once: true });

const shadow = document.querySelector('.shadow-cursor');
document.addEventListener('mousemove', (e) => {
    shadow.style.left = e.clientX + 'px';
    shadow.style.top = e.clientY + 'px';
});

const wordList = ["别盯着屏幕", "听得到吗", "靠近一点", "不要闭眼", "它在看你", "别转动你的头", "呼吸轻一点", "我们在看着你"];
function createFloat() {
    const div = document.createElement('div');
    div.className = "float";
    div.innerText = wordList[Math.floor(Math.random() * wordList.length)];
    div.style.left = Math.random() * 90 + "%";
    const duration = Math.random() * 9 + 7;
    div.style.animationDuration = duration + "s";
    document.body.appendChild(div);
    setTimeout(() => div.remove(), duration * 1000);
}
setInterval(createFloat, 1000);

const pop = document.getElementById("popBox");
let popShowing = false;
function showPop() {
    if (popShowing) return;
    popShowing = true;
    pop.style.display = "block";
    setTimeout(() => {
        pop.style.display = "none";
        popShowing = false;
    }, 1800);
}
setInterval(() => {
    if (Math.random() > 0.65) showPop();
}, 6000);
</script>
</body>
</html>
