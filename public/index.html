<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial‑scale=1.0">
<title>sys_log_service | 服务查询终端</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#0a0a0a;
  color:#b8c2cc;
  font-family: "Consolas","Courier New",monospace;
  min-height:100vh;
  padding:28px;
  font-size:14px;
}
.container{
  max-width:680px;
  margin:0 auto;
  border:1px solid #272e36;
  background:#0e1116;
  padding:22px;
}
.header-line{
  color:#627280;
  font-size:12px;
  margin-bottom:18px;
}
.warn-text{
  color:#e27062;
}
.input-area{
  margin-top:26px;
}
input{
  background:#080a0d;
  border:1px solid #343c47;
  color:#d0d8e0;
  padding:9px 11px;
  width:72%;
  font-family:Consolas;
  font-size:14px;
}
button{
  background:#1f262e;
  color:#c5cfd9;
  border:1px solid #444c58;
  padding:9px 14px;
  cursor:pointer;
}
#feedback{
  margin-top:14px;
  min-height:20px;
  font-size:13px;
}
#payload{
  display:none;
  margin-top:28px;
  border-top:1px solid #272e36;
  padding-top:20px;
  white-space: pre-wrap;
}
</style>
</head>
<body>
<div class="container">
  <div class="header-line">
    SYS‑LOG‑SERVICE v2.1.4&nbsp;&nbsp;| 会话ID:7384‑0f91‑ac22&nbsp;&nbsp;| 部分存储扇区损坏
  </div>

  <div>
    <p>> 日志索引加载完成。</p>
    <p>> <span class="warn-text">警告：37% 的记录块存在校验异常</span></p>
    <p>> 请输入访问令牌以读取受限数据集。</p>
    <p>> <span class="warn-text">通报：公元2026年8月22日18时13分，我司发生一起恶性事件</span></p>
    <p>> <span class="warn-text">主管王XX与同事刘XX酒后发生冲突</span></p>
    <p>> <span class="warn-text">后勾结黑社会约架，造成人员受伤</span></p>
    <p>> <span class="warn-text">以及公司财务受损，现已移交公安机关处理</span></p>
  </div>

  <div class="input-area">
    <input id="tokenInput" placeholder="请输入访问令牌">
    <button onclick="submitToken()">提交查询</button>
  </div>

  <div id="feedback"></div>
  <div id="payload"></div>
</div>

<script>
const WORKER_API = "/api/verify";

async function submitToken(){
  const inputVal = document.getElementById("tokenInput").value.trim();
  const feed = document.getElementById("feedback");
  const payloadBox = document.getElementById("payload");

  feed.innerText = "正在校验令牌...";
  payloadBox.style.display = "none";
  payloadBox.innerText = "";

  try {
    const res = await fetch(WORKER_API, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ token: inputVal })
    });
    const data = await res.json();
    feed.innerText = data.msg;
    if(data.success){
      payloadBox.innerText = data.content;
      payloadBox.style.display = "block";
    }
  } catch(err){
    feed.innerText = "网络异常，无法连接存储服务";
  }
}
</script>
</body>
</html>
